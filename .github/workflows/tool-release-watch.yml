# tool-release-watch.yml — 盯上游发版 → 云端编译 Windows 免安装版 → 存进私库 Release
#
# 监控 4 个工具（要加就往 tools/watch_plan.py 的 TOOLS 里加一条）：
#   ripgrep (BurntSushi/ripgrep, cargo)
#   fd      (sharkdp/fd,       cargo)
#   fzf     (junegunn/fzf,     go)
#   jq      (jqlang/jq,        autotools + MSYS2 UCRT64，上游 tag 下没有 CMakeLists)
#
# 流程：plan 查各上游 latest tag 并与 .state/tool-watch.json 比对，只留下有变化的工具
#      → build 只对有变化的工具下载源码、在 windows-latest 上从源码编译
#      → 打包 zip + sha256 → 上传私库滚动 Release `tools-latest`（同名资产 --clobber 覆盖）
#      → record 合并 state 并提交、同步私库 tools/manifest.json
#      → notify 走邮件（未配邮件时降级 GitHub Issue）
#
# 密钥：PRIVATE_REPO_TOKEN = 对私库有 contents:write 的 Pat，只用于 Release 上传和清单更新。
#       未配置时整个流程仍会编译并留下 run artifact，只是不上传、不发通知失败。
# 频率：cron 0 3 * * 1 = 每周一 03:00 UTC = 11:00 Asia/Shanghai，一周一次（不用高频）。
# 产物落地：本机执行私库 scripts/install-from-release.ps1 即安装。

name: tool-release-watch

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 只跑指定工具（逗号分隔，留空=按 state 自动判断）
        required: false
        type: string
        default: ''
      dry_run:
        description: 只编译打包，不上传私库 Release、不改清单
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: tool-release-watch
  cancel-in-progress: false

env:
  PRIVATE_REPO: 762yje/dsh-cloud
  RELEASE_TAG: tools-latest
  STATE_FILE: .state/tool-watch.json

jobs:
  # ── 1. 计划：哪些工具需要编译 ───────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 比对上游 tag 与本地 state
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
          STATE_PATH: ${{ env.STATE_FILE }}
        run: python3 tools/watch_plan.py
  # ── 2. 编译矩阵 ────────────────────────────────────────────────────────────
  build:
    needs: plan
    if: needs.plan.outputs.selected != ''
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ripgrep
            repo: BurntSushi/ripgrep
            kind: cargo
            bin: rg
            exe: rg.exe
            source: src/target/release/rg.exe
          - name: fd
            repo: sharkdp/fd
            kind: cargo
            bin: fd
            exe: fd.exe
            source: src/target/release/fd.exe
          - name: fzf
            repo: junegunn/fzf
            kind: go
            exe: fzf.exe
            source: src/fzf.exe
          - name: jq
            repo: jqlang/jq
            kind: msys2
            exe: jq.exe
            source: dist-jq
    env:
      PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gate（本工具是否在计划内）
        id: gate
        shell: bash
        env:
          SELECTED: ${{ needs.plan.outputs.selected }}
          TOOL: ${{ matrix.name }}
        run: |
          set -uo pipefail
          case ",${SELECTED}," in
            *",${TOOL},"*) echo "skip=false" >> "$GITHUB_OUTPUT"; echo "${TOOL}: selected" ;;
            *)            echo "skip=true"  >> "$GITHUB_OUTPUT"; echo "${TOOL}: not selected" ;;
          esac

      - name: Checkout 上游源码（cargo / go）
        if: steps.gate.outputs.skip != 'true' && matrix.kind != 'msys2'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ fromJson(needs.plan.outputs.tags)[matrix.name] }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build（cargo）
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'cargo'
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          cd src
          cargo build --release --bin "${BIN}"
          ls -l "target/release/${BIN}.exe"

      - name: Build（go）
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'go'
        shell: bash
        run: |
          set -euo pipefail
          cd src
          go build -trimpath -ldflags "-s -w" -o fzf.exe .
          ls -l fzf.exe

      - name: Set up MSYS2（jq）
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            bison
            flex

      - name: Build（jq，autotools）
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'msys2'
        shell: msys2 {0}
        env:
          TAG: ${{ fromJson(needs.plan.outputs.tags)[matrix.name] }}
        run: |
          set -euo pipefail
          curl -fsSL -o jq-src.tar.gz "https://github.com/jqlang/jq/releases/download/${TAG}/${TAG}.tar.gz"
          tar xf jq-src.tar.gz
          mkdir -p dist-jq
          cd "${TAG}"
          ./configure --prefix=/ucrt64 --with-oniguruma=builtin --disable-maintainer-mode --disable-shared CFLAGS='-O2 -DNDEBUG' LDFLAGS='-static'
          make -j"$(nproc)"
          bin=""
          for c in ./jq.exe ./.libs/jq.exe ./jq ./.libs/jq; do
            if [ -f "$c" ]; then bin="$c"; break; fi
          done
          if [ -z "$bin" ]; then echo "::error::jq 编译产物没找到"; ls -la . .libs 2>/dev/null | head -40; exit 1; fi
          cp "$bin" ../dist-jq/jq.exe
          ../dist-jq/jq.exe --version

      - name: Collect binary
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          SRC: ${{ matrix.source }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${SRC}" "dist/${EXE}"
          ls -l dist

      # 脱离 MSYS2 环境再跑一次：证明打出来的 exe 在裸 Windows 上能起来（不是只靠 /ucrt64 的 PATH）。
      - name: 独立运行自检
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          EXE: ${{ matrix.exe }}
        run: |
          $exe = Join-Path 'dist' $env:EXE
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "$env:EXE 在裸环境里跑不起来（exit $LASTEXITCODE）" }
          Write-Host "$env:EXE 独立运行 OK"

      - name: Package and hash
        id: pack
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          TOOL: ${{ matrix.name }}
          TAG: ${{ fromJson(needs.plan.outputs.tags)[matrix.name] }}
        run: |
          $ver = ($env:TAG -replace '^v', '') -replace '^jq-', ''
          $asset = "dsh-$($env:TOOL)-$ver-windows-x64.zip"
          Compress-Archive -Path 'dist/*' -DestinationPath $asset -CompressionLevel Optimal -Force
          $sha = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item -LiteralPath $asset).Length
          "asset=$asset"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ver=$ver"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ASSET=$asset"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "$asset $size bytes sha256=$sha"

      - name: Upload run artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dsh-*.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload to private release
        id: upload
        if: steps.gate.outputs.skip != 'true' && env.PRIVATE_TOKEN != '' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -uo pipefail
          gh release view "$RELEASE_TAG" -R "$PRIVATE_REPO" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" -R "$PRIVATE_REPO" \
                 --title 'tools-latest' \
                 --notes '滚动工具镜像：只保留最新构建，旧资产用 --clobber 覆盖。' >/dev/null 2>&1 \
            || true
          gh release upload "$RELEASE_TAG" "$ASSET" -R "$PRIVATE_REPO" --clobber
          echo "uploaded $ASSET -> $PRIVATE_REPO $RELEASE_TAG"

      - name: Record result
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          TOOL: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          EXE: ${{ matrix.exe }}
          TAG: ${{ fromJson(needs.plan.outputs.tags)[matrix.name] }}
          ASSET: ${{ steps.pack.outputs.asset }}
          SHA: ${{ steps.pack.outputs.sha }}
          SIZE: ${{ steps.pack.outputs.size }}
          UPLOADED: ${{ steps.upload.outcome }}
        run: |
          New-Item -ItemType Directory -Force -Path report | Out-Null
          $obj = [ordered]@{
            name     = $env:TOOL
            repo     = $env:REPO
            tag      = $env:TAG
            exe_path = $env:EXE
            asset    = $env:ASSET
            sha256   = $env:SHA
            size     = [int64]$env:SIZE
            uploaded = ($env:UPLOADED -eq 'success')
          }
          $obj | ConvertTo-Json -Compress |
            Out-File -FilePath "report/$($env:TOOL).json" -Encoding utf8

      - name: Upload report
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.name }}
          path: report/*.json
          retention-days: 14
          if-no-files-found: error

  # ── 3. 记账：state + 私库清单 ─────────────────────────────────────────────
  record:
    needs: [plan, build]
    if: always() && needs.plan.outputs.selected != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.merge.outputs.summary }}
    env:
      PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch build reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: report-*
          merge-multiple: true

      - name: Merge state
        id: merge
        env:
          STATE_PATH: ${{ env.STATE_FILE }}
        run: python3 tools/merge_watch_state.py --reports reports --state "$STATE_PATH"

      - name: Commit state
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .state
          git commit -m "chore(watch): ${{ steps.merge.outputs.summary }} [skip ci]" || exit 0
          for i in 1 2 3; do
            git push && { echo "pushed"; exit 0; }
            git pull --rebase --autostash || true
            sleep 10
          done
          echo "::warning::state push failed after 3 attempts"

      - name: Update private tool manifest
        if: env.PRIVATE_TOKEN != '' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(reports/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no reports"; exit 0; fi
          for f in "${files[@]}"; do
            echo "-- manifest: $(basename "$f")"
            python3 tools/update_manifest.py --report "$f" --target "$PRIVATE_REPO" \
              || echo "::warning::manifest update failed for $(basename "$f")"
          done

  # ── 4. 通知（邮件为主，未配邮件降级 Issue） ────────────────────────────────
  notify:
    needs: [plan, build, record]
    if: always() && needs.plan.outputs.selected != ''
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: tool-release-watch
      status: ${{ needs.build.result }}
      title: ${{ needs.build.result == 'success' && '工具镜像已更新' || '工具镜像更新失败' }}
      message: ${{ needs.record.outputs.summary }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
